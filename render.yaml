services:
  - type: web
    name: videosaver
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && apt-get update -qq && apt-get install -y -qq ffmpeg && (which node || apt-get install -y -qq nodejs)"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: DOWNLOAD_BACKEND
        sync: false  # set to "telegram" or leave empty for auto
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: BOT_USERNAME
        value: allsaverbot
